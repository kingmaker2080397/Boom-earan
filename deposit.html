<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit Funds - Boom</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --gold: #ffcc00; --dark: #0a0a0a; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        .container { max-width: 400px; margin: auto; border: 2px solid var(--gold); border-radius: 20px; padding: 20px; background: #111; box-shadow: 0 0 20px rgba(255, 204, 0, 0.1); }
        h2 { color: var(--gold); margin-bottom: 25px; }

        /* Admin Number Box */
        .info-box { background: #222; border-radius: 12px; padding: 15px; border-left: 5px solid var(--gold); text-align: left; margin-bottom: 20px; }
        .info-box p { margin: 5px 0; font-size: 14px; }
        .admin-num { color: var(--gold); font-size: 20px; font-weight: 800; letter-spacing: 1px; }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; box-sizing: border-box; font-size: 16px; }
        
        .upload-area { border: 2px dashed #444; padding: 20px; border-radius: 10px; margin: 15px 0; cursor: pointer; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border-radius: 8px; }

        .btn-submit { background: var(--gold); color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 16px; text-transform: uppercase; }
        .btn-back { display: block; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💰 Deposit Funds</h2>

        <div class="info-box">
            <p><b>Method:</b> EasyPaisa / JazzCash</p>
            <p><b>Account Name:</b> Boom Admin Official</p>
            <p><b>Send Money To:</b></p>
            <div id="admin-num-display" class="admin-num">Loading...</div>
            <p style="font-size: 10px; color: #888; margin-top: 5px;">(Admin updates this number automatically)</
