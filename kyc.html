<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
        authDomain: "boom-earnings.firebaseapp.com",
        databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
        projectId: "boom-earnings",
        storageBucket: "boom-earnings.firebasestorage.app",
        appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // ImgBB Upload Function (Using your API Key)
    async function uploadToImgBB(file) {
        const apiKey = "a25b5bea8eb38a1ecf404154d85a4bf"; 
        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        return data.data.url;
    }

    // Submit KYC Logic
    window.submitKYC = async () => {
        const file = document.getElementById('id-card-input').files[0];
        const fullName = document.getElementById('full-name').value;
        const user = auth.currentUser;

        if (!file || !fullName) return alert("Please fill all fields!");

        alert("Uploading... please wait");
        
        try {
            const photoUrl = await uploadToImgBB(file); // Free Upload
            await set(ref(db, 'kyc_requests/' + user.uid), {
                uid: user.uid,
                name: fullName,
                idPhoto: photoUrl,
                status: "pending"
            });
            alert("KYC Submitted Successfully!");
        } catch (error) {
            console.error(error);
            alert("Upload failed!");
        }
    };
</script>
