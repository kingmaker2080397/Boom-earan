<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Verification - Boom Earnings</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #111; border: 2px solid gold; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        h2 { color: gold; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; margin-bottom: 20px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .preview-box { width: 100%; height: 180px; border: 1px dashed gold; margin: 15px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; }
        #id-preview { max-width: 100%; max-height: 100%; display: none; }
        .submit-btn { width: 100%; padding: 15px; background: gold; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .back-link { display: block; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡️ KYC Verification</h2>
    <p>Upload your ID Card for account security.</p>

    <input type="text" id="full-name" placeholder="Full Name (As per ID)">
    
    <div class="preview-box" id="preview-container">
        <span id="text-hint" style="color:#444;">ID Preview</span>
        <img id="id-preview" src="">
    </div>

    <input type="file" id="id-file" accept="image/*" onchange="showPreview(event)">
    
    <button class="submit-btn" onclick="submitKYC()">SUBMIT FOR REVIEW</button>
    <a href="index.html" class="back-link">⬅️ Back to Home</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
        authDomain: "boom-earnings.firebaseapp.com",
        databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
        projectId: "boom-earnings",
        appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let userDetails = null;

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = 'login.html';
        } else {
            userDetails = user;
        }
    });

    // Image Preview Function
    window.showPreview = (event) => {
        const file = event.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('id-preview');
                img.src = e.target.result;
                img.style.display = "block";
                document.getElementById('text-hint').style.display = "none";
            };
            reader.readAsDataURL(file);
        }
    };

    // Submit Function
    window.submitKYC = async () => {
        const name = document.getElementById('full-name').value;
        const file = document.getElementById('id-file').files[0];

        if(!name || !file) return Swal.fire("Error", "Please fill all fields", "error");

        Swal.fire({ title: 'Uploading...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            try {
                const base64Img = reader.result;
                const kycRef = push(ref(db, 'kyc'));
                
                await set(kycRef, {
                    uid: userDetails.uid,
                    email: userDetails.email,
                    fullName: name,
                    idCardUrl: base64Img,
                    status: "pending",
                    timestamp: Date.now()
                });

                Swal.fire("Success", "KYC submitted! Admin will verify it soon.", "success")
                .then(() => window.location.href = 'index.html');

            } catch (err) {
                Swal.fire("Error", err.message, "error");
            }
        };
    };
</script>

</body>
</html>
