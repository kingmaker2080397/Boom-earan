<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal - Maker Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ef4444; --bg: #070b14; --card: #1e293b; --gold: #fbbf24; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; text-align: center; padding-bottom: 40px; }
        
        .header { padding: 25px 20px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; }
        .back-btn { text-decoration: none; color: var(--gold); font-size: 24px; }

        .main-card { 
            background: var(--card); margin: 20px; padding: 25px; border-radius: 25px; 
            border: 1px solid rgba(239, 68, 68, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .bal-box { background: #0f172a; padding: 20px; border-radius: 20px; margin-bottom: 20px; border-left: 4px solid var(--gold); }
        .bal-amount { font-size: 32px; color: var(--gold); font-weight: 700; }
        
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 11px; color: #94a3b8; margin-left: 5px; text-transform: uppercase; }

        input { 
            width: 100%; padding: 15px; margin-top: 5px; border-radius: 12px; 
            border: 1px solid #334155; background: #070b14; color: white; 
            box-sizing: border-box; font-size: 15px; outline: none;
        }

        .fee-info { 
            background: rgba(251, 191, 36, 0.05); padding: 12px; border-radius: 12px; 
            margin: 15px 0; text-align: left; font-size: 13px; color: #cbd5e1;
        }
        .fee-info div { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .payout-amt { color: #22c55e; font-weight: bold; font-size: 16px; }

        .btn-submit { 
            width: 100%; padding: 18px; background: var(--primary); border: none; 
            border-radius: 15px; color: white; font-weight: 800; font-size: 16px; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }
        .btn-submit:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }

        .status-badge { font-size: 12px; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; display: inline-block; }
        .pending { background: rgba(251, 191, 36, 0.1); color: var(--gold); border: 1px solid var(--gold); }
        .approved { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e; }
    </style>
</head>
<body>

    <div class="header">
        <a href="profile.html" class="back-btn">❮</a>
        <span>WITHDRAW USDT</span>
        <div style="width:24px;"></div>
    </div>

    <div class="main-card">
        <div id="kycBadge" class="status-badge pending">Checking KYC Status...</div>

        <div class="bal-box">
            <div style="font-size: 11px; color: #94a3b8;">AVAILABLE BALANCE</div>
            <div class="bal-amount" id="displayBal">0.00 USDT</div>
        </div>

        <div class="input-group">
            <label>Amount to Withdraw</label>
            <input type="number" id="wAmount" placeholder="Min 10 USDT" oninput="calculateFee()">
        </div>

        <div class="fee-info">
            <div><span>Withdrawal Fee (5%):</span> <span id="feeLabel">0.00 USDT</span></div>
            <div style="border-top: 1px solid #334155; padding-top: 5px; margin-top: 5px;">
                <span>You will receive:</span> <span class="payout-amt" id="finalPayout">0.00 USDT</span>
            </div>
        </div>

        <div class="input-group">
            <label>Withdrawal Account (Saved in KYC)</label>
            <input type="text" id="wAccount" readonly>
        </div>

        <button class="btn-submit" id="withdrawBtn" onclick="submitWithdrawal()" disabled>SUBMIT REQUEST</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCh-1xi3jkIj5hUsmbm3GFGfT_AlWmxYkk", 
            databaseURL: "https://maker-trading-official-default-rtdb.firebaseio.com/" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const phone = localStorage.getItem("userPhone");

        let currentBalance = 0;
        let isKycApproved = false;
        const FEE_PERCENT = 5; // 5% Fee

        if (!phone) window.location.href = 'login.html';

        // 1. Fetch User Data (Balance & KYC)
        onValue(ref(db, 'users/' + phone), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentBalance = data.wallet || 0;
                document.getElementById('displayBal').innerText = currentBalance.toFixed(2) + " USDT";
                document.getElementById('wAccount').value = data.idNumber || "No Address Saved";
                
                const badge = document.getElementById('kycBadge');
                if(data.kycStatus === "Approved") {
                    badge.innerText = "Verified Account ✅";
                    badge.className = "status-badge approved";
                    isKycApproved = true;
                    document.getElementById('withdrawBtn').disabled = false;
                } else {
                    badge.innerText = "KYC Pending/Required ⚠️";
                    badge.className = "status-badge pending";
                }
            }
        });

        // 2. Fee Calculation Logic
        window.calculateFee = () => {
            const amt = parseFloat(document.getElementById('wAmount').value) || 0;
            const fee = (amt * FEE_PERCENT) / 100;
            const final = amt - fee;

            document.getElementById('feeLabel').innerText = fee.toFixed(2) + " USDT";
            document.getElementById('finalPayout').innerText = (final > 0 ? final.toFixed(2) : "0.00") + " USDT";
        };

        // 3. Submit Withdrawal to Admin
        window.submitWithdrawal = async () => {
            const amt = parseFloat(document.getElementById('wAmount').value);
            const btn = document.getElementById('withdrawBtn');

            if (!isKycApproved) return alert("Your KYC is not approved yet!");
            if (amt < 10) return alert("Minimum withdrawal is 10 USDT");
            if (amt > currentBalance) return alert("Insufficient Balance!");

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                // Deduct Balance
                const newBal = currentBalance - amt;
                await update(ref(db, 'users/' + phone), { wallet: newBal });

                // Push to Withdrawal Requests (Admin will see this)
                const withdrawData = {
                    phone: phone,
                    requestedAmount: amt,
                    fee: (amt * FEE_PERCENT) / 100,
                    finalPayout: amt - ((amt * FEE_PERCENT) / 100),
                    address: document.getElementById('wAccount').value,
                    status: "Pending",
                    timestamp: Date.now(),
                    date: new Date().toLocaleString()
                };

                const newRef = push(ref(db, 'withdraw_requests'));
                await set(newRef, withdrawData);

                // Add to History
                await push(ref(db, 'user_history/' + phone), {
                    type: "Withdrawal",
                    amount: amt,
                    status: "LOSS",
                    time: Date.now()
                });

                alert("Withdrawal Request Sent! Admin will process it within 24h.");
                window.location.href = "profile.html";

            } catch (error) {
                alert("Something went wrong!");
                btn.disabled = false;
                btn.innerText = "SUBMIT REQUEST";
            }
        };
    </script>
</body>
</html>
