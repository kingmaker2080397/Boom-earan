<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom - Leaderboard</title>
    <style>
        body { background: #000; color: gold; font-family: sans-serif; text-align: center; padding: 20px; }
        .ladder-box { background: #111; border: 2px solid gold; border-radius: 15px; padding: 20px; max-width: 400px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #333; }
        th { color: #fff; border-bottom: 2px solid gold; }
        .rank-1 { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏆 Top Players</h1>
    <div class="ladder-box">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>User</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody id="leaderboard-data">
                <tr><td colspan="3">Loading...</td></tr>
            </tbody>
        </table>
    </div>
    <br>
    <button onclick="location.href='index.html'" style="padding:10px 20px; background:gold; border:none; font-weight:bold; cursor:pointer; border-radius:5px;">Back to Game</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch Top 10 Players
        const topUsers = query(ref(db, 'users'), orderByChild('balance'), limitToLast(10));
        onValue(topUsers, (snap) => {
            const tbody = document.getElementById('leaderboard-data');
            tbody.innerHTML = "";
            let users = [];
            snap.forEach((child) => {
                users.push(child.val());
            });
            users.reverse(); // Highest balance first

            users.forEach((user, index) => {
                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${user.email ? user.email.split('@')[0] : 'User'}</td>
                    <td>PKR ${user.balance || 0}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });
    </script>
</body>
      </html>
