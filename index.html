<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boom Professional</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --gold: #ffcc00; --red: #ff3131; --blue: #007bff; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        
        /* Fake Patti (Scrolling Wins) */
        .win-ticker { background: rgba(255,204,0,0.1); border-bottom: 1px solid var(--gold); height: 30px; overflow: hidden; white-space: nowrap; position: relative; }
        .ticker-text { display: inline-block; animation: scroll 20s linear infinite; font-size: 13px; color: var(--gold); line-height: 30px; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .header { display: flex; justify-content: space-between; padding: 15px; background: #111; border-bottom: 2px solid var(--gold); align-items: center; }
        .bal-chip { background: #222; border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; }
        
        .timer { font-size: 60px; font-weight: 900; color: var(--gold); margin: 15px 0; }
        .vs-area { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .fighter img { width: 120px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        
        .card { width: 80px; height: 110px; background: #222; border: 2px solid var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; transition: 0.6s; transform-style: preserve-3d; }
        .flipped { transform: rotateY(180deg); background: #fff; color: #000; }

        .bet-input { background: #111; border: 2px solid var(--gold); color: var(--gold); padding: 12px; width: 150px; border-radius: 10px; font-size: 20px; margin: 20px 0; text-align: center; }
        .btn-group { display: flex; justify-content: center; gap: 15px; padding: 0 15px; }
        .bet-btn { flex: 1; padding: 18px; border: none; border-radius: 12px; font-weight: bold; color: #fff; cursor: pointer; font-size: 16px; }
        .btn-tiger { background: linear-gradient(#ff4b2b, #ff416c); }
        .btn-dragon { background: linear-gradient(#0052d4, #6fb1fc); }

        .nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav a { color: #888; text-decoration: none; font-size: 12px; font-weight: bold; }
        .nav a.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="win-ticker">
        <div class="ticker-text" id="fake-patti">Loading latest wins...</div>
    </div>

    <div class="header">
        <div id="user-display">Hi, Player 🇵🇰</div>
        <div class="bal-chip">PKR <span id="balance">0</span></div>
    </div>

    <div class="timer" id="timer">15</div>
    <div id="status" style="color:cyan; font-weight:bold;">Betting Open</div>

    <div class="vs-area">
        <div class="fighter">
            <img src="https://www.pngmart.com/files/22/Tiger-Logo-PNG-Image.png" alt="Tiger">
            <div id="card-tiger" class="card">?</div>
            <h3 style="color:var(--red)">TIGER</h3>
        </div>
        <div style="font-size:30px; font-weight:bold; color:var(--gold)">VS</div>
        <div class="fighter">
            <img src="https://img.icons8.com/color/200/dragon.png" alt="Dragon">
            <div id="card-dragon" class="card">?</div>
            <h3 style="color:var(--blue)">DRAGON</h3>
        </div>
    </div>

    <input type="number" id="bet-amount" class="bet-input" value="100">

    <div class="btn-group">
        <button class="bet-btn btn-tiger" onclick="placeBet('tiger')">BET TIGER</button>
        <button class="bet-btn btn-dragon" onclick="placeBet('dragon')">BET DRAGON</button>
    </div>

    <div class="nav">
        <a href="deposit.html">DEPOSIT</a>
        <a href="withdraw.html">WITHDRAW</a>
        <a href="ladder.html">LADDER</a>
        <a href="profile.html">PROFILE</a>
        <a href="kyc.html">KYC</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = { /* Paste your config here */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentBalance = 0;
        let timeLeft = 15;
        let myBets = [];

        // Sound System
        const sndClick = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3');
        const sndWin = new Audio('https://www.soundjay.com/human/sounds/applause-01.mp3');

        // Fake Patti Data
        const fakeUsers = ["Asif", "Zeeshan", "John", "Khurram", "Malik", "Raja", "Sohail"];
        setInterval(() => {
            const user = fakeUsers[Math.floor(Math.random()*fakeUsers.length)];
            const win = Math.floor(Math.random()*5000) + 500;
            document.getElementById('fake-patti').innerText = `🎉 ${user} won PKR ${win} | 🎰 New round started | 🔥 Big win by Raja PKR 12,000 | 🐉 Dragon Streak...`;
        }, 5000);

        onAuthStateChanged(auth, (user) => {
            if(user) {
                onValue(ref(db, `users/${user.uid}`), (snap) => {
                    const data = snap.val();
                    currentBalance = data?.balance || 0;
                    document.getElementById('balance').innerText = currentBalance;
                    document.getElementById('user-display').innerText = `Hi, ${data?.name || 'Player'} 🇵🇰`;
                });
                startTimer();
            } else { window.location.href = 'login.html'; }
        });

        function startTimer() {
            let interval = setInterval(() => {
                if(timeLeft > 0) {
                    document.getElementById('timer').innerText = timeLeft;
                    timeLeft--;
                } else {
                    clearInterval(interval);
                    processResult();
                }
            }, 1000);
        }

        async function processResult() {
            const snap = await get(ref(db, 'gameControl/nextResult'));
            let winner = snap.val() || 'random';
            if(winner === 'random') winner = Math.random() > 0.5 ? 'tiger' : 'dragon';

            const cardId = winner === 'tiger' ? 'card-tiger' : 'card-dragon';
            const card = document.getElementById(cardId);
            card.classList.add('flipped');
            card.innerText = Math.floor(Math.random()*10)+1;

            setTimeout(async () => {
                let winAmt = 0;
                myBets.forEach(b => { if(b.side === winner) winAmt += b.amount * 2; });

                if(winAmt > 0) {
                    sndWin.play();
                    await update(ref(db, `users/${auth.currentUser.uid}`), { balance: currentBalance + winAmt });
                    Swal.fire("Winner!", `+PKR ${winAmt}`, "success");
                }

                setTimeout(() => {
                    timeLeft = 15; myBets = [];
                    document.querySelectorAll('.card').forEach(c => { c.classList.remove('flipped'); c.innerText="?"; });
                    startTimer();
                }, 3000);
            }, 1500);
        }

        window.placeBet = async (side) => {
            const amt = parseInt(document.getElementById('bet-amount').value);
            if(amt > currentBalance) return Swal.fire("Low Balance", "", "error");
            sndClick.play();
            myBets.push({side, amount: amt});
            await update(ref(db, `users/${auth.currentUser.uid}`), { balance: currentBalance - amt });
        };
    </script>
</body>
</html>
