<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Earning - Dragon vs Tiger</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Game Page Styles */
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; margin: 0; text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1f1f1f; border-bottom: 2px solid #ffcc00; }
        .balance-box { font-size: 20px; font-weight: bold; color: #ffcc00; }
        .profile-btn { background: #ffcc00; color: black; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; }
        
        .game-container { padding: 40px 20px; }
        .game-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .timer-box { font-size: 24px; color: #ffcc00; margin-bottom: 30px; }
        
        .button-group { display: flex; justify-content: center; gap: 20px; }
        .bet-btn { width: 150px; height: 150px; border-radius: 15px; border: none; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s; color: black; }
        .dragon { background: linear-gradient(145deg, #ff4b2b, #ff416c); box-shadow: 0 0 15px rgba(255, 75, 43, 0.5); }
        .tiger { background: linear-gradient(145deg, #4b6cb7, #182848); color: white; box-shadow: 0 0 15px rgba(75, 108, 183, 0.5); }
        .bet-btn:active { transform: scale(0.9); }
        
        /* Footer for Navigation */
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: #1f1f1f; padding: 10px 0; display: flex; justify-content: space-around; }
        .footer-nav a { color: white; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="balance-box">
            💰 <span id="top-balance">0</span>
        </div>
        <a href="profile.html" class="profile-btn">MY PROFILE 👤</a>
    </div>

    <div class="game-container">
        <div class="game-title">
            <span style="color: #ff4b2b;">DRAGON</span> 
            <span style="color: #ffcc00;">VS</span> 
            <span style="color: #4b6cb7;">TIGER</span>
        </div>

        <div class="timer-box" id="timer">
            Next Round: 00:15
        </div>

        <div class="button-group">
            <button class="bet-btn dragon" onclick="placeBet('dragon')">DRAGON</button>
            <button class="bet-btn tiger" onclick="placeBet('tiger')">TIGER</button>
        </div>
    </div>

    <div class="footer-nav">
        <a href="index.html">🏠 Home</a>
        <a href="deposit.html">💵 Deposit</a>
        <a href="withdraw.html">🏦 Withdraw</a>
    </div>

    <script type="module" src="main.js?v=1.2"></script>

</body>
</html>
