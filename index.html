<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon vs Tiger - Boom</title>
    <style>
        :root { --gold: #ffcc00; --dragon: #ff4444; --tiger: #4444ff; }
        body { background: radial-gradient(circle, #222, #000); color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; height: 100vh; }
        .header { background: rgba(17, 17, 17, 0.95); padding: 15px 20px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(5px); }
        .balance-display { font-size: 1.2rem; font-weight: bold; color: var(--gold); }
        .game-area { padding: 40px 10px; }
        .timer-box { font-size: 1.5rem; margin: 20px 0; color: var(--gold); }
        .bet-box { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .btn-game { padding: 40px 20px; border-radius: 20px; font-weight: 800; width: 160px; cursor: pointer; border: 3px solid rgba(255,255,255,0.1); font-size: 1.2rem; text-transform: uppercase; }
        .dragon-btn { background: linear-gradient(145deg, #ff4444, #880000); box-shadow: 0 5px 15px rgba(255, 68, 68, 0.4); }
        .tiger-btn { background: linear-gradient(145deg, #4444ff, #000088); box-shadow: 0 5px 15px rgba(68, 68, 255, 0.4); }
        .profile-icon { background: var(--gold); color: #000; padding: 8px 15px; border-radius: 50px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="balance-display">💰 <span id="top-balance">0</span></div>
        <a href="profile.html" class="profile-icon">MY PROFILE 👤</a>
    </div>
    <div class="game-area">
        <h1>DRAGON <span style="color:var(--gold)">VS</span> TIGER</h1>
        <div class="timer-box" id="timer">Next Round: 00:15</div>
        <div class="bet-box">
            <button class="btn-game dragon-btn" onclick="placeBet('dragon')">DRAGON</button>
            <button class="btn-game tiger-btn" onclick="placeBet('tiger')">TIGER</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    if (snap.exists()) document.getElementById('top-balance').innerText = snap.val().balance || 0;
                });
            } else { location.href = 'login.html'; }
        });
        window.placeBet = (s) => alert("Bet placed on " + s);
    </script>
</body>
</html>
