<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Dragon vs Tiger - Professional</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; overflow: hidden; }
        
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #111; border-bottom: 2px solid #ffcc00; }
        .balance-box { font-size: 20px; font-weight: bold; color: #ffcc00; }

        /* Timer Section */
        .timer-container { margin: 20px auto; width: 160px; padding: 10px; background: #1a1a1a; border: 1px solid #ffcc00; border-radius: 12px; }
        #time-left { font-size: 24px; color: #ffcc00; font-weight: 900; }

        /* 3D LUXURY BUTTONS */
        .game-container { display: flex; justify-content: center; gap: 15px; padding: 10px; }
        .btn-3d {
            position: relative; width: 150px; height: 180px;
            border-radius: 20px; border: none; cursor: pointer;
            transition: all 0.1s ease; box-shadow: 0 8px 0 #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
        
        .btn-dragon { background: linear-gradient(145deg, #ff4b2b, #ff416c); }
        .btn-tiger { background: linear-gradient(145deg, #4b6cb7, #182848); }
        
        .char-img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 10px; }
        .bet-indicator { font-size: 12px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; display: none; }

        /* Result Popup */
        #popup {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 320px; background: #1a1a1a; border: 3px solid #ffcc00;
            border-radius: 25px; padding: 25px; z-index: 1000; box-shadow: 0 0 50px #000;
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #111; padding: 12px 0; }
        .nav-item { flex: 1; color: #888; text-decoration: none; font-size: 13px; }
        .nav-item.active { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>
    <div id="popup">
        <h2 id="res-status" style="font-size: 30px; margin: 0;"></h2>
        <p id="res-desc" style="font-size: 18px; color: #ccc;"></p>
        <div style="font-size: 40px; margin: 15px 0;" id="res-nums">0 vs 0</div>
        <button onclick="closePop()" style="background:#ffcc00; border:none; padding:12px 40px; border-radius:10px; font-weight:bold; cursor:pointer;">CONTINUE</button>
    </div>

    <div class="top-bar">
        <div class="balance-box">💰 PKR <span id="balance">0</span></div>
        <button onclick="location.href='profile.html'" style="background:#ffcc00; border:none; padding:8px 15px; border-radius:20px; font-weight:bold;">PROFILE 👤</button>
    </div>

    <div class="game-info">
        <h2 style="color:#ffcc00; letter-spacing: 2px;">DRAGON vs TIGER</h2>
        <div class="timer-container">
            <div style="font-size: 12px; color: #888;">NEXT ROUND</div>
            <div id="time-left">00:15</div>
        </div>
    </div>

    <div class="game-container">
        <button class="btn-3d btn-dragon" onclick="handleBet('dragon')">
            <img src="dragon_photo.png" class="char-img">
            <span style="font-weight:bold; font-size:18px;">DRAGON</span>
            <div id="d-bet-tag" class="bet-indicator">BET PLACED</div>
        </button>

        <button class="btn-3d btn-tiger" onclick="handleBet('tiger')">
            <img src="tiger_photo.png" class="char-img">
            <span style="font-weight:bold; font-size:18px;">TIGER</span>
            <div id="t-bet-tag" class="bet-indicator">BET PLACED</div>
        </button>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item active">🏠<br>Home</a>
        <a href="deposit.html" class="nav-item">💵<br>Deposit</a>
        <a href="withdraw.html" class="nav-item">🏦<br>Withdraw</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentBalance = 0;
        let selectedSide = null;
        const betAmount = 100; // Fixed bet amount for testing

        // 1. Load Real-time Balance
        onValue(ref(db, 'users/' + auth.currentUser?.uid), (snap) => {
            if(snap.exists()) {
                currentBalance = snap.val().balance || 0;
                document.getElementById('balance').innerText = currentBalance;
            }
        });

        // 2. Bet Handling with Balance Check
        window.handleBet = async (side) => {
            if (currentBalance < betAmount) {
                alert("Sain, balance kam hai! Pehle deposit karein.");
                return;
            }
            if (selectedSide) return; // Prevent multiple bets

            selectedSide = side;
            // Visual feedback instead of alert
            document.getElementById(side === 'dragon' ? 'd-bet-tag' : 't-bet-tag').style.display = 'block';
            
            // Deduct balance immediately
            const newBal = currentBalance - betAmount;
            await update(ref(db, 'users/' + auth.currentUser.uid), { balance: newBal });
        };

        // 3. Game Timer & Professional Result
        let timer = 15;
        setInterval(async () => {
            timer--;
            if (timer < 0) {
                await processResult();
                timer = 15;
            }
            document.getElementById('time-left').innerText = "00:" + (timer < 10 ? "0"+timer : timer);
        }, 1000);

        async function processResult() {
            const dVal = Math.floor(Math.random() * 13) + 1;
            const tVal = Math.floor(Math.random() * 13) + 1;
            const winner = dVal > tVal ? 'dragon' : 'tiger';

            if (selectedSide) {
                const isWin = selectedSide === winner;
                const status = document.getElementById('res-status');
                const desc = document.getElementById('res-desc');
                
                if (isWin) {
                    const winPrize = betAmount * 2;
                    await update(ref(db, 'users/' + auth.currentUser.uid), { balance: currentBalance + winPrize });
                    status.innerText = "WINNER! 🎉";
                    status.style.color = "#ffcc00";
                    desc.innerText = "You won PKR " + winPrize;
                } else {
                    status.innerText = "LOSE! 💔";
                    status.style.color = "#ff4444";
                    desc.innerText = "Try again in next round!";
                }

                document.getElementById('res-nums').innerText = `${dVal} vs ${tVal}`;
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('popup').style.display = 'block';
            }
            resetBoard();
        }

        window.closePop = () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('popup').style.display = 'none';
        };

        function resetBoard() {
            selectedSide = null;
            document.getElementById('d-bet-tag').style.display = 'none';
            document.getElementById('t-bet-tag').style.display = 'none';
        }
    </script>
</body>
</html>
