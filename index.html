<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boom King - Dragon Tiger</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --gold: #ffcc00; --red: #ff3131; --blue: #007bff; }
        body { background: #000; color: #fff; font-family: 'Poppins', sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
        
        /* Header */
        .top-nav { display: flex; justify-content: space-between; padding: 15px; background: #111; border-bottom: 2px solid var(--gold); align-items: center; }
        .bal-box { background: rgba(255,204,0,0.1); border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .verify-badge { color: #00ff00; font-size: 12px; font-weight: bold; }

        /* Game Section */
        .game-header { margin: 20px 0; }
        .timer-circle { font-size: 50px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        
        .vs-zone { display: flex; justify-content: space-around; align-items: center; margin: 30px 0; padding: 0 10px; }
        .fighter { width: 45%; transition: 0.3s; }
        .fighter img { width: 100%; max-width: 130px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        
        /* Cards */
        .card-box { width: 70px; height: 100px; background: #222; border: 2px solid var(--gold); border-radius: 8px; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 30px; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-box.flipped { transform: rotateY(180deg); background: #fff; color: #000; }

        /* Betting Controls */
        .bet-input { background: #111; border: 2px solid var(--gold); color: var(--gold); padding: 12px; width: 120px; border-radius: 10px; text-align: center; font-size: 20px; margin-bottom: 20px; }
        .btn-group { display: flex; justify-content: center; gap: 15px; padding: 0 15px; }
        .bet-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: bold; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 15px; }
        .btn-tiger { background: linear-gradient(#ff4b2b, #ff416c); box-shadow: 0 5px #900; }
        .btn-dragon { background: linear-gradient(#0052d4, #6fb1fc); box-shadow: 0 5px #003; }
        .bet-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Footer Nav */
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; }
        .nav-link { color: #888; text-decoration: none; font-size: 11px; font-weight: bold; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="user-info">
            <span id="player-name">Hi, Player</span>
            <span id="v-status"></span>
            <span>🇵🇰</span>
        </div>
        <div class="bal-box">PKR <span id="balance">0</span></div>
    </div>

    <div class="game-header">
        <div class="timer-circle" id="timer">15</div>
        <div id="status" style="color: #00f2ff; font-weight: bold;">Betting Open</div>
    </div>

    <div class="vs-zone">
        <div class="fighter">
            <img src="https://www.pngmart.com/files/22/Tiger-Logo-PNG-Image.png" alt="Tiger">
            <div id="card-tiger" class="card-box">?</div>
            <h3 style="color:var(--red)">TIGER</h3>
        </div>
        
        <div style="font-size: 24px; color: var(--gold); font-weight: bold;">VS</div>

        <div class="fighter">
            <img src="https://img.icons8.com/color/200/dragon.png" alt="Dragon">
            <div id="card-dragon" class="card-box">?</div>
            <h3 style="color:var(--blue)">DRAGON</h3>
        </div>
    </div>

    <input type="number" id="bet-amount" class="bet-input" value="100">

    <div class="btn-group">
        <button class="bet-btn btn-tiger" onclick="placeBet('tiger')">BET TIGER</button>
        <button class="bet-btn btn-dragon" onclick="placeBet('dragon')">BET DRAGON</button>
    </div>

    <div class="footer-nav">
        <a href="deposit.html" class="nav-link">DEPOSIT</a>
        <a href="withdraw.html" class="nav-link">WITHDRAW</a>
        <a href="ladder.html" class="nav-link">LADDER</a>
        <a href="profile.html" class="nav-link">PROFILE</a>
        <a href="kyc.html" class="nav-link">KYC</a>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
