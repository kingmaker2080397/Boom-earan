<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boom - Sher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #111; border-bottom: 2px solid gold; align-items: center; }
        .balance-box { color: gold; font-weight: bold; font-size: 20px; text-shadow: 0 0 5px gold; }
        
        /* Timer & Status */
        .timer-circle { font-size: 40px; color: gold; border: 4px solid gold; display: inline-block; width: 85px; height: 85px; line-height: 75px; border-radius: 50%; margin: 15px; background: radial-gradient(#222, #000); }
        #result-display { font-size: 22px; color: #00f2ff; font-weight: bold; min-height: 30px; margin-bottom: 10px; }

        /* Game Area */
        .cards-container { display: flex; justify-content: space-around; align-items: center; padding: 10px; }
        .card-box { width: 45%; background: #080808; border: 2px solid #222; border-radius: 20px; padding: 15px; transition: 0.3s; }
        .card-box img { width: 100%; max-width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
        .tiger-label { color: #ff4444; font-size: 22px; font-weight: bold; margin-top: 10px; }
        .dragon-label { color: #4444ff; font-size: 22px; font-weight: bold; margin-top: 10px; }

        /* Betting Area */
        .bet-controls { margin: 20px 0; }
        input#bet-amount { background: #111; border: 2px solid gold; color: gold; padding: 12px; width: 140px; border-radius: 10px; font-size: 20px; text-align: center; }
        .bet-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .btn { padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; width: 150px; font-size: 16px; color: white; transition: 0.2s; }
        .btn-tiger { background: linear-gradient(to bottom, #ff4444, #8b0000); border-bottom: 4px solid #5a0000; }
        .btn-dragon { background: linear-gradient(to bottom, #4444ff, #0d47a1); border-bottom: 4px solid #06214a; }
        .btn:active { transform: translateY(3px); border-bottom: none; }

        /* Share Section */
        .share-box { background: #111; padding: 20px; margin-top: 30px; border-top: 1px solid gold; }
        .share-box p { color: gold; margin-bottom: 10px; font-weight: bold; }
        .copy-input-group { display: flex; justify-content: center; gap: 5px; }
        #referral-link-input { width: 60%; padding: 12px; background: #000; color: #00f2ff; border: 1px solid #444; border-radius: 5px; }
        .copy-btn { background: gold; color: #000; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .admin-notice { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div id="display-email">User</div>
        <div class="balance-box">💰 <span id="balance">0</span> PKR</div>
    </div>

    <div class="nav" style="margin: 10px;">
        <button onclick="location.href='deposit.html'">DEPOSIT</button>
        <button onclick="location.href='withdraw.html'">WITHDRAW</button>
        <button onclick="location.href='ladder.html'">LEADERBOARD</button>
    </div>

    <div class="timer-circle" id="timer">15</div>
    <div id="result-display">PLACING BETS...</div>

    <div class="cards-container">
        <div class="card-box">
            <img src="https://www.pngplay.com/wp-content/uploads/12/Tiger-Logo-PNG-Clipart-Background.png" alt="Sher">
            <div class="tiger-label">SHER (TIGER)</div>
        </div>
        <div style="font-size: 40px; color: gold;">VS</div>
        <div class="card-box">
            <img src="https://img.icons8.com/color/200/dragon.png" alt="Dragon">
            <div class="dragon-label">DRAGON</div>
        </div>
    </div>

    <div class="bet-controls">
        <input type="number" id="bet-amount" value="100">
        <div class="bet-buttons">
            <button class="btn btn-tiger" onclick="placeBet('tiger')">BET SHER 🐅</button>
            <button class="btn btn-dragon" onclick="placeBet('dragon')">BET DRAGON 🐉</button>
        </div>
    </div>

    <div class="share-box">
        <p>📢 SHARE & EARN COMMISSION</p>
        <div class="copy-input-group">
            <input type="text" id="referral-link-input" readonly>
            <button class="copy-btn" onclick="copyShareLink()">COPY</button>
        </div>
        <div class="admin-notice">Deposit Number: <span id="admin-num" style="color:white;">Loading...</span></div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
