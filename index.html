<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boom - Sher vs Dragon</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        .header { display: flex; justify-content: space-between; padding: 12px; background: #111; border-bottom: 2px solid gold; }
        .balance-box { color: gold; font-weight: bold; font-size: 20px; }
        .timer-circle { font-size: 35px; color: gold; border: 4px solid gold; display: inline-block; width: 75px; height: 75px; line-height: 65px; border-radius: 50%; margin: 10px; background: #111; }
        
        /* Fake Patti Animation */
        .card-anim { width: 50px; height: 70px; background: gold; border: 2px solid white; border-radius: 5px; position: absolute; top: -100px; transition: 1s ease-in-out; z-index: 10; font-size: 30px; }
        .patti-active { top: 200px !important; }

        .cards-container { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .card-box img { width: 130px; height: 130px; object-fit: contain; }
        
        .bet-buttons { display: flex; justify-content: center; gap: 15px; margin: 15px; }
        .btn { padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; width: 140px; font-size: 16px; color: #fff; }
        .btn-tiger { background: linear-gradient(#ff4444, #8b0000); }
        .btn-dragon { background: linear-gradient(#4444ff, #0d47a1); }
        
        .nav-footer { background: #111; padding: 15px; position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; border-top: 1px solid gold; }
        .nav-footer button { background: none; border: 1px solid gold; color: gold; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div id="display-email">Player</div>
        <div class="balance-box">💰 <span id="balance">0</span></div>
    </div>

    <div id="patti-tiger" class="card-anim" style="left: 20%;">🎴</div>
    <div id="patti-dragon" class="card-anim" style="right: 20%;">🎴</div>

    <div class="timer-circle" id="timer">15</div>
    <div id="result-display" style="font-size: 20px; color: cyan; font-weight: bold;">Betting Open...</div>

    <div class="cards-container">
        <div class="card-box">
            <img src="https://www.pngmart.com/files/22/Tiger-Logo-PNG-Image.png" alt="Sher">
            <h3 style="color:red;">SHER (TIGER)</h3>
        </div>
        <div style="font-size: 30px; color: gold;">VS</div>
        <div class="card-box">
            <img src="https://img.icons8.com/color/200/dragon.png" alt="Dragon">
            <h3 style="color:blue;">DRAGON</h3>
        </div>
    </div>

    <input type="number" id="bet-amount" value="100" style="padding:10px; width:120px; background:#111; color:gold; border:1px solid gold; text-align:center; border-radius:5px;">
    
    <div class="bet-buttons">
        <button class="btn btn-tiger" onclick="placeBet('tiger')">BET SHER</button>
        <button class="btn btn-dragon" onclick="placeBet('dragon')">BET DRAGON</button>
    </div>

    <div class="nav-footer">
        <button onclick="location.href='deposit.html'">DEPOSIT</button>
        <button onclick="location.href='withdraw.html'">WITHDRAW</button>
        <button onclick="location.href='ladder.html'">LEADERBOARD</button>
        <button onclick="location.href='kyc.html'">KYC</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
