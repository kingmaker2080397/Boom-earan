<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boom Earnings - Professional</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --gold: #ffcc00; --red: #ff3333; --blue: #3385ff; }
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px; background: rgba(20,20,20,0.9); border-bottom: 2px solid var(--gold); backdrop-filter: blur(10px); }
        .balance-chip { background: #1a1a1a; padding: 8px 15px; border-radius: 50px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }
        
        /* Game Table */
        .game-area { padding: 20px; position: relative; }
        .timer-display { font-size: 48px; font-weight: 800; color: var(--gold); text-shadow: 0 0 15px rgba(255,204,0,0.5); margin: 10px 0; }
        
        .versus-container { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .fighter-box { width: 40%; transition: transform 0.3s; }
        .fighter-box img { width: 100%; max-width: 140px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        
        /* Card Flip Animation */
        .card-slot { perspective: 1000px; margin-top: 15px; }
        .card-inner { width: 80px; height: 110px; transition: transform 0.6s; transform-style: preserve-3d; position: relative; margin: auto; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; border: 2px solid var(--gold); }
        .card-front { background: linear-gradient(45deg, #222, #444); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .card-back { background: #fff; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }

        /* Action Buttons */
        .bet-input-wrap { margin: 20px 0; }
        #bet-amount { background: #111; border: 2px solid var(--gold); color: var(--gold); padding: 12px; width: 120px; border-radius: 10px; font-size: 18px; text-align: center; }
        
        .btn-grid { display: flex; justify-content: center; gap: 15px; padding: 0 10px; }
        .bet-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; color: #fff; text-transform: uppercase; }
        .btn-tiger { background: linear-gradient(to bottom, #ff3333, #990000); box-shadow: 0 5px #660000; }
        .btn-dragon { background: linear-gradient(to bottom, #3385ff, #0047b3); box-shadow: 0 5px #002b66; }
        .bet-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Footer Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav-item { color: #888; text-decoration: none; font-size: 12px; font-weight: bold; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-weight: 900; color: var(--gold); letter-spacing: 1px;">BOOM 🚀</div>
        <div class="balance-chip">PKR <span id="balance">0</span></div>
    </div>

    <div class="game-area">
        <div class="timer-display" id="timer">15</div>
        <div id="status" style="color: #00ffcc; font-weight: bold;">Betting Open</div>

        <div class="versus-container">
            <div class="fighter-box">
                <img src="https://www.pngplay.com/wp-content/uploads/12/Tiger-Logo-PNG-Clipart-Background.png" alt="Tiger">
                <div class="card-slot">
                    <div id="card-tiger" class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">A</div>
                    </div>
                </div>
                <p style="color:var(--red); font-weight:bold;">TIGER</p>
            </div>

            <div style="font-size: 24px; color: var(--gold); font-weight: 900;">VS</div>

            <div class="fighter-box">
                <img src="https://img.icons8.com/color/200/dragon.png" alt="Dragon">
                <div class="card-slot">
                    <div id="card-dragon" class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">K</div>
                    </div>
                </div>
                <p style="color:var(--blue); font-weight:bold;">DRAGON</p>
            </div>
        </div>

        <div class="bet-input-wrap">
            <input type="number" id="bet-amount" value="100" min="10">
        </div>

        <div class="btn-grid">
            <button class="bet-btn btn-tiger" onclick="placeBet('tiger')">BET TIGER</button>
            <button class="bet-btn btn-dragon" onclick="placeBet('dragon')">BET DRAGON</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="deposit.html" class="nav-item">DEPOSIT</a>
        <a href="withdraw.html" class="nav-item">WITHDRAW</a>
        <a href="ladder.html" class="nav-item">LADDER</a>
        <a href="kyc.html" class="nav-item">KYC</a>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
