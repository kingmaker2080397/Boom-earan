<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Tiger vs Dragon</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css"> <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #111; border-bottom: 2px solid gold; }
        .balance-box { color: gold; font-weight: bold; font-size: 20px; }
        .game-area { margin-top: 20px; }
        .timer-circle { font-size: 40px; color: gold; margin: 20px; border: 3px solid gold; display: inline-block; width: 80px; height: 80px; line-height: 80px; border-radius: 50%; }
        .cards-container { display: flex; justify-content: center; gap: 50px; margin: 20px; }
        .card-box img { width: 150px; border-radius: 10px; }
        .bet-buttons { margin-top: 30px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; margin: 10px; }
        .btn-tiger { background: #d32f2f; color: white; }
        .btn-dragon { background: #1976d2; color: white; }
        #result-display { font-size: 24px; color: cyan; margin-top: 15px; min-height: 40px; }
        .ref-section { background: #111; padding: 20px; margin-top: 40px; border-top: 1px solid #333; }
        input#referral-link-input { width: 250px; padding: 10px; background: #000; color: gold; border: 1px solid gold; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div id="display-email">Loading...</div>
        <div class="balance-box">💰 PKR <span id="balance">0</span></div>
    </div>

    <div class="nav-btns" style="margin-top:10px;">
        <button onclick="location.href='deposit.html'">Deposit</button>
        <button onclick="location.href='withdraw.html'">Withdraw</button>
        <button onclick="location.href='kyc.html'">KYC</button>
    </div>

    <div class="game-area">
        <div class="timer-circle" id="timer">15</div>
        <div id="result-display">Betting Started!</div>

        <div class="cards-container">
            <div class="card-box">
                <img src="https://www.shutterstock.com/image-vector/tiger-head-mascot-logo-vector-260nw-1510390169.jpg" id="tiger-img" alt="Tiger">
                <h2 style="color: #d32f2f;">TIGER</h2>
            </div>
            <div style="font-size: 50px; align-self: center;">VS</div>
            <div class="card-box">
                <img src="https://t4.ftcdn.net/jpg/02/74/43/84/360_F_274438497_l5vE36K2mS9FkE6Zz9XjO8N7lS3p9k1F.jpg" id="dragon-img" alt="Dragon">
                <h2 style="color: #1976d2;">DRAGON</h2>
            </div>
        </div>

        <input type="number" id="bet-amount" value="100" style="padding: 10px; border-radius: 5px; width: 150px;">
        <div class="bet-buttons">
            <button class="btn btn-tiger" onclick="placeBet('tiger')">BET TIGER</button>
            <button class="btn btn-dragon" onclick="placeBet('dragon')">BET DRAGON</button>
        </div>
    </div>

    <div class="ref-section">
        <p>Invite Friends & Earn:</p>
        <input type="text" id="referral-link-input" readonly>
        <button onclick="copyRefLink()" style="padding:10px; background:gold; border:none; font-weight:bold;">COPY LINK</button>
    </div>

    <audio id="sound-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="sound-win" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>
    <audio id="sound-timer" src="https://www.soundjay.com/clock/sounds/clock-ticking-2.mp3"></audio>

    <script type="module" src="main.js"></script>
</body>
</html>
