<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Master Admin</title>
    <style>
        body { background: #000; color: gold; font-family: sans-serif; padding: 15px; }
        .panel { border: 2px solid gold; padding: 15px; border-radius: 12px; margin-bottom: 20px; background: #111; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; font-weight: bold; border: none; }
        input { background: #222; color: #fff; border: 1px solid #444; }
        button { background: gold; color: #000; cursor: pointer; }
        .req-box { background: #222; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; border-left: 4px solid gold; }
    </style>
</head>
<body>
    <h2>🚀 Boom Admin Master</h2>

    <div class="panel">
        <h3>💰 Update Deposit Number</h3>
        <input type="text" id="new-num" placeholder="Enter EasyPaisa Number">
        <button onclick="updateNumber()">Update App</button>
    </div>

    <div class="panel">
        <h3>📩 Pending Approvals</h3>
        <div id="pending-list">Loading Requests...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.updateNumber = () => {
            const num = document.getElementById('new-num').value;
            set(ref(db, 'adminSettings/depositNumber'), num).then(() => alert("Updated!"));
        };

        onValue(ref(db), (snap) => {
            const list = document.getElementById('pending-list');
            list.innerHTML = "";
            const data = snap.val();

            // Admin Logic ka main part jo update karna hai:
window.setRes = (winner) => {
    set(ref(db, 'gameControl/nextResult'), winner)
    .then(() => Swal.fire("Success", "Next Winner: " + winner, "success"));
};

window.updateNum = () => {
    const num = document.getElementById('admin-num').value;
    // Yeh "adminSettings" path per save hoga jo deposit.html fetch karega
    set(ref(db, 'adminSettings/depositNumber'), num)
    .then(() => Swal.fire("Updated", "Deposit number changed for all users", "success"));
};
        
            // Show Withdrawals
            if(data.withdrawals) {
                for(let id in data.withdrawals) if(data.withdrawals[id].status === 'pending') {
                    list.innerHTML += `<div class="req-box">
                        <b>WITHDRAW:</b> ${data.withdrawals[id].amount} PKR<br>
                        Account: ${data.withdrawals[id].number}<br>
                        <button onclick="approveWithdraw('${id}', '${data.withdrawals[id].uid}')">APPROVE</button>
                    </div>`;
                }
            }

            // Show Deposits
            if(data.deposits) {
                for(let id in data.deposits) if(data.deposits[id].status === 'pending') {
                    list.innerHTML += `<div class="req-box">
                        <b>DEPOSIT:</b> ${data.deposits[id].amount} PKR<br>
                        TrxID: ${data.deposits[id].trxid}<br>
                        <button onclick="approveDep('${id}', '${data.deposits[id].uid}', ${data.deposits[id].amount})">APPROVE</button>
                    </div>`;
                }
            }
        });

        window.approveDep = (id, uid, amt) => {
            get(ref(db, `users/${uid}/balance`)).then((s) => {
                update(ref(db, `users/${uid}`), { balance: (s.val() || 0) + amt });
                update(ref(db, `deposits/${id}`), { status: 'approved' });
            });
        };
    </script>
</body>
</html>
