<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Admin Master - 3D Control</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .card { background: #151515; border: 1px solid #333; border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.3); }

        /* --- 3D Button Style --- */
        .btn-3d {
            position: relative;
            display: inline-block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 #000; /* Bottom shadow for 3D look */
        }
        .btn-3d:active {
            transform: translateY(4px); /* Push down effect */
            box-shadow: 0 2px 0 #000;
        }

        .btn-dragon { background: linear-gradient(#ff4b2b, #ff416c); box-shadow: 0 6px 0 #b32a15; }
        .btn-tiger { background: linear-gradient(#4b6cb7, #182848); box-shadow: 0 6px 0 #2a3d6d; }
        .btn-update { background: linear-gradient(#ffcc00, #ff9900); color: black; box-shadow: 0 6px 0 #cc8800; }
        .btn-random { background: linear-gradient(#444, #222); box-shadow: 0 6px 0 #111; }

        input { width: 90%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; margin-bottom: 10px; font-size: 16px; }
        .status-box { background: #000; padding: 10px; border-radius: 8px; color: #00ff00; font-family: monospace; }
    </style>
</head>
<body>

    <h2>🚀 BOOM ADMIN MASTER CONTROL</h2>

    <div class="card">
        <h3>💰 SET DEPOSIT NUMBER</h3>
        <input type="text" id="admin-num" placeholder="EasyPaisa/JazzCash Number">
        <button class="btn-3d btn-update" onclick="updateNumber()">UPDATE USER APP 📲</button>
    </div>

    <div class="card">
        <h3>🎮 GAME RESULT (FORCE WIN)</h3>
        <div class="status-box" id="current-mode">Current Mode: LOADING...</div>
        <button class="btn-3d btn-dragon" onclick="setMode('dragon')">FORCE DRAGON WIN 🐉</button>
        <button class="btn-3d btn-tiger" onclick="setMode('tiger')">FORCE TIGER WIN 🐯</button>
        <button class="btn-3d btn-random" onclick="setMode('random')">RANDOM (NORMAL) 🎲</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        // Aapka Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Deposit Number Function ---
        window.updateNumber = () => {
            const num = document.getElementById('admin-num').value;
            if(!num) { alert("Sain, number toh likhein!"); return; }
            set(ref(db, 'admin/deposit_number'), num)
            .then(() => alert("User Application Updated Successfully!"));
        };

        // --- Game Force Mode Function ---
        window.setMode = (mode) => {
            set(ref(db, 'game_settings/next_winner'), mode)
            .then(() => alert("Game Mode Set To: " + mode.toUpperCase()));
        };

        // Live Mode Viewer
        onValue(ref(db, 'game_settings/next_winner'), (snap) => {
            document.getElementById('current-mode').innerText = "Current Mode: " + (snap.val() || "random").toUpperCase();
        });
    </script>
</body>
</html>
