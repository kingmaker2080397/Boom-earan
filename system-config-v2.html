<!DOCTYPE html>
<html>
<head>
    <title>Master Admin - Connected</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #000; color: gold; font-family: sans-serif; padding: 20px; }
        .card { border: 2px solid gold; padding: 20px; margin-bottom: 20px; background: #111; border-radius: 10px; }
        input, button { padding: 12px; margin: 5px; border-radius: 5px; border: none; font-weight: bold; }
        input { width: 300px; background: #222; color: #fff; border: 1px solid #444; }
        button { background: gold; color: #000; cursor: pointer; }
        .item { background: #222; padding: 10px; margin: 5px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <h1>🚀 Master Admin (Real-Time)</h1>

    <div class="card">
        <h3>💰 Change User App Deposit Number</h3>
        <input type="text" id="admin-num" placeholder="EasyPaisa/JazzCash Number">
        <button onclick="updateNumber()">Update Now</button>
    </div>

    <div class="card">
        <h3>🎮 Game Result</h3>
        <button onclick="setResult('tiger')">Tiger Win</button>
        <button onclick="setResult('dragon')">Dragon Win</button>
        <button onclick="setResult('random')">Reset Random</button>
    </div>

    <div class="card">
        <h3>📋 Pending KYC / Deposits</h3>
        <div id="pending-list">Fetching from Firebase...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Admin Number Update
        window.updateNumber = () => {
            const num = document.getElementById('admin-num').value;
            set(ref(db, 'adminSettings/depositNumber'), num).then(() => Swal.fire("Success", "Number Updated on App", "success"));
        };

        window.setResult = (res) => set(ref(db, 'gameControl/nextResult'), res);

        // Fetch All Requests (KYC and Deposit)
        onValue(ref(db), (snap) => {
            const list = document.getElementById('pending-list');
            list.innerHTML = "";
            const data = snap.val();
            if(!data) return;

            // KYC Requests
            if(data.kyc) {
                for(let id in data.kyc) if(data.kyc[id].status === 'pending') {
                    list.innerHTML += `<div class="item"><span>KYC: ${data.kyc[id].email}</span> <button onclick="approveKYC('${id}','${data.kyc[id].uid}')">Approve</button></div>`;
                }
            }
            // Deposit Requests
            if(data.deposits) {
                for(let id in data.deposits) if(data.deposits[id].status === 'pending') {
                    list.innerHTML += `<div class="item"><span>Dep: ${data.deposits[id].amount} (${data.deposits[id].email})</span> <button onclick="approveDep('${id}','${data.deposits[id].uid}', ${data.deposits[id].amount})">Approve</button></div>`;
                }
            }
        });

        window.approveKYC = (id, uid) => {
            update(ref(db, `users/${uid}`), { kycVerified: true });
            update(ref(db, `kyc/${id}`), { status: 'verified' });
        };

        window.approveDep = (id, uid, amt) => {
            get(ref(db, `users/${uid}/balance`)).then((snap) => {
                const newBal = (snap.val() || 0) + amt;
                update(ref(db, `users/${uid}`), { balance: newBal });
                update(ref(db, `deposits/${id}`), { status: 'approved' });
            });
        };
    </script>
</body>
</html>
