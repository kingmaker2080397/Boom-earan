<!DOCTYPE html>
<html>
<head>
    <title>Admin - Update Deposit Number</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #000; color: gold; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { border: 2px solid gold; padding: 20px; background: #111; border-radius: 10px; max-width: 500px; margin: auto; }
        input { padding: 12px; width: 80%; background: #222; color: #fff; border: 1px solid #444; margin: 10px 0; }
        button { padding: 12px 25px; background: gold; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>💰 Update Deposit Number</h2>
        <p>Yahan EasyPaisa/JazzCash likhein:</p>
        <input type="text" id="admin-num" placeholder="Example: EasyPaisa 03001234567">
        <button onclick="updateNumber()">Update on User App</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.updateNumber = () => {
            const num = document.getElementById('admin-num').value;
            if(!num) return alert("Number likhein!");
            set(ref(db, 'adminSettings/depositNumber'), num)
                .then(() => Swal.fire("Success", "Number Deposit Page par update ho gaya!", "success"));
        };
    </script>
</body>
</html>
