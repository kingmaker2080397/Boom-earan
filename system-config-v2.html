<!DOCTYPE html>
<html>
<head>
    <title>Master Control - Full Power</title>
    <style>
        body { background: #000; color: gold; font-family: sans-serif; padding: 20px; }
        .section { border: 2px solid #333; padding: 15px; margin-bottom: 20px; border-radius: 10px; background: #050505; }
        h2 { color: #fff; border-bottom: 1px solid gold; padding-bottom: 5px; margin-top: 0; }
        .card { background: #111; border: 1px solid #444; padding: 10px; margin: 10px 0; border-radius: 8px; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; margin: 5px; }
        .btn-rej { background: #dc3545; }
        .btn-game { min-width: 120px; font-size: 14px; }
        img { max-width: 150px; display: block; margin: 10px 0; border: 1px solid gold; }
        .status-badge { color: cyan; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🚀 Boom Master Control Panel</h1>

    <div class="section" style="border-color: gold;">
        <h2>🎮 Result Control (Next Round)</h2>
        <p>Current Mode: <span id="current-setting" class="status-badge">RANDOM</span></p>
        <button class="btn-game" style="background: #d32f2f;" onclick="setResult('tiger')">FORCE TIGER 🐯</button>
        <button class="btn-game" style="background: #1976d2;" onclick="setResult('dragon')">FORCE DRAGON 🐉</button>
        <button class="btn-game" style="background: #555;" onclick="setResult('random')">RANDOM 🎲</button>
    </div>

    <div class="section">
        <h2>💰 Deposit Requests</h2>
        <div id="deposit-list">Loading...</div>
    </div>

    <div class="section">
        <h2>💸 Withdraw Requests</h2>
        <div id="withdraw-list">Loading...</div>
    </div>

    <div class="section">
        <h2>🛡️ KYC Approvals</h2>
        <div id="kyc-list">Loading...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Result Manipulation Function
        window.setResult = async (mode) => {
            await update(ref(db, 'gameControl'), { nextResult: mode });
            document.getElementById('current-setting').innerText = mode.toUpperCase();
            alert("Setting updated to: " + mode);
        };

        // Fetch Current Game Control Setting
        onValue(ref(db, 'gameControl/nextResult'), (snap) => {
            document.getElementById('current-setting').innerText = (snap.val() || "RANDOM").toUpperCase();
        });

        // Load Deposits
        onValue(ref(db, 'deposits'), (snap) => {
            const list = document.getElementById('deposit-list');
            list.innerHTML = ""; const data = snap.val();
            if(!data) { list.innerHTML = "No pending deposits."; return; }
            for(let key in data) if(data[key].status === 'pending') {
                const div = document.createElement('div'); div.className = "card";
                div.innerHTML = `<p>User: ${data[key].email} | PKR ${data[key].amount}</p>
                    <img src="${data[key].screenshotUrl}"><button onclick="approveDep('${key}', '${data[key].uid}', ${data[key].amount})">APPROVE</button>`;
                list.appendChild(div);
            }
        });

        window.approveDep = async (id, uid, amt) => {
            const uRef = ref(db, `users/${uid}`); const uSnap = await get(uRef);
            const bal = uSnap.val()?.balance || 0;
            await update(uRef, { balance: bal + amt });
            await update(ref(db, `deposits/${id}`), { status: "approved" });
            alert("Deposit Added!");
        };

        // Load Withdrawals
        onValue(ref(db, 'withdrawals'), (snap) => {
            const list = document.getElementById('withdraw-list');
            list.innerHTML = ""; const data = snap.val();
            if(!data) { list.innerHTML = "No pending withdrawals."; return; }
            for(let key in data) if(data[key].status === 'pending') {
                const div = document.createElement('div'); div.className = "card";
                div.innerHTML = `<p>User: ${data[key].email} | PKR ${data[key].amount}</p>
                    <p>Wallet: ${data[key].walletAddress}</p><button onclick="approveWith('${key}')">SENT ✅</button>`;
                list.appendChild(div);
            }
        });

        window.approveWith = async (id) => {
            await update(ref(db, `withdrawals/${id}`), { status: "completed" });
            alert("Withdraw Completed!");
        };
    </script>
</body>
</html>
