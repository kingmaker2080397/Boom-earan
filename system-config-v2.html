<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>body{background:#000;color:#fff;font-family:sans-serif;padding:20px;}.card{border:1px solid gold;padding:15px;margin:10px;background:#111;}</style>
</head>
<body>
    <h1>Master Control</h1>
    <div id="deposit-requests">Loading Deposits...</div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
        const firebaseConfig = { /* PASTE CONFIG */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        onValue(ref(db, 'deposits'), (snap) => {
            const div = document.getElementById('deposit-requests');
            div.innerHTML = "";
            snap.forEach(child => {
                const d = child.val();
                div.innerHTML += `<div class="card">
                    <p>User: ${d.email} | Amount: RS ${d.amount}</p>
                    <a href="${d.screenshotUrl}" target="_blank">View Screenshot</a><br><br>
                    <button onclick="approve('${d.uid}', ${d.amount}, '${child.key}')">Approve & Add Balance</button>
                </div>`;
            });
        });
        window.approve = async (uid, amt, key) => {
            const uRef = ref(db, 'users/' + uid);
            const cur = (await get(uRef)).val().balance || 0;
            await update(uRef, { balance: cur + amt });
            await remove(ref(db, 'deposits/' + key));
            alert("Approved!");
        };
    </script>
</body>
</html>
