<!DOCTYPE html>
<html>
<head>
    <title>Master Admin Control</title>
    <style>
        body { background: #000; color: gold; font-family: sans-serif; padding: 20px; }
        .card { background: #111; border: 1px solid gold; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        button { padding: 10px; background: gold; border: none; font-weight: bold; cursor: pointer; margin: 5px; border-radius: 5px; }
        input { padding: 10px; width: 300px; background: #222; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>
    <h2>🚀 Master Control Panel</h2>

    <div class="card">
        <h3>🎮 Result Control</h3>
        <button onclick="setRes('tiger')">Tiger Win 🐅</button>
        <button onclick="setRes('dragon')">Dragon Win 🐉</button>
        <button onclick="setRes('random')">Set Random 🎲</button>
    </div>

    <div class="card">
        <h3>💰 Change Deposit Address</h3>
        <input type="text" id="new-addr" placeholder="Enter EasyPaisa/JazzCash Number">
        <button onclick="updateAddr()">Update Address</button>
    </div>

    <div class="card">
        <h3>🛡️ KYC Requests</h3>
        <div id="kyc-requests">Loading...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.setRes = (val) => set(ref(db, 'gameControl/nextResult'), val);
        window.updateAddr = () => {
            const addr = document.getElementById('new-addr').value;
            set(ref(db, 'adminSettings/depositAddress'), addr).then(() => alert("Address Updated!"));
        };

        onValue(ref(db, 'kyc'), (snap) => {
            const div = document.getElementById('kyc-requests');
            div.innerHTML = "";
            const data = snap.val();
            for(let key in data) if(data[key].status==='pending') {
                div.innerHTML += `<div style="border-bottom:1px solid #444; padding:10px;">
                    ${data[key].email} <button onclick="approveKYC('${key}','${data[key].uid}')">Approve</button>
                </div>`;
            }
        });

        window.approveKYC = (id, uid) => {
            update(ref(db, `users/${uid}`), { kycVerified: true });
            update(ref(db, `kyc/${id}`), { status: 'verified' });
        };
    </script>
</body>
</html>
