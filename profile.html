<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Boom Official</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #111; border: 2px solid #ffcc00; border-radius: 20px; padding: 30px; max-width: 400px; margin: auto; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ffcc00; object-fit: cover; margin-bottom: 10px; }
        .v-badge { font-weight: bold; font-size: 18px; margin: 15px 0; }
        .info { background: #222; padding: 15px; border-radius: 10px; text-align: left; margin: 20px 0; }
        .info p { margin: 10px 0; font-size: 16px; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-back { background: #ffcc00; color: #000; }
        .btn-upload { background: #444; color: #fff; font-size: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <img id="user-pic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-img">
        <input type="file" id="photo-input" hidden accept="image/*">
        <button class="btn-upload" onclick="document.getElementById('photo-input').click()">CHANGE PHOTO</button>

        <div id="verified-badge" class="v-badge">Checking Status...</div>

        <div class="info">
            <p>💰 Balance: <b id="u-balance" style="color:#ffcc00">PKR 0</b></p>
            <p>📧 Email: <span id="u-email">...</span></p>
        </div>

        <button class="btn-back" onclick="location.href='index.html'">BACK TO GAME</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        // Aapki Fixed Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // ImgBB API Key
        const IMGBB_KEY = "a25b5bea8eb38a1ecf404154d85a4bf";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('u-email').innerText = user.email;

                // Real-time Data Fetching
                onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('u-balance').innerText = "PKR " + (data.balance || 0);
                        document.getElementById('user-pic').src = data.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                        
                        // Verified Tick Logic
                        const badge = document.getElementById('verified-badge');
                        if (data.kycStatus === "verified") {
                            badge.innerHTML = "Verified Member ✅";
                            badge.style.color = "#00ff00";
                        } else {
                            badge.innerHTML = "Status: Pending ⏳";
                            badge.style.color = "#ff4444";
                        }
                    }
                });

                // Photo Upload to ImgBB Logic
                document.getElementById('photo-input').onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    Swal.fire('Uploading...');
                    
                    let formData = new FormData();
                    formData.append("image", file);

                    try {
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
                            method: "POST",
                            body: formData
                        });
                        const resData = await res.json();
                        const finalUrl = resData.data.url;

                        // Save Link to Firebase
                        await update(ref(db, 'users/' + user.uid), { profilePic: finalUrl });
                        Swal.fire('Success', 'Photo Updated!', 'success');
                    } catch (err) {
                        Swal.fire('Error', 'Upload Failed', 'error');
                    }
                };

            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
