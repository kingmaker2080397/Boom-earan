<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        .profile-card { background: #111; margin: 20px; padding: 30px; border-radius: 15px; border: 1px solid #ffcc00; }
        .status-v { color: #00ff00; font-weight: bold; margin-top: 10px; display: block; }
        button { background: #ffcc00; color: #000; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>👤 User Profile</h2>
    <div class="profile-card">
        <div style="font-size: 50px;">👤</div>
        <h3 id="u-email">Loading...</h3>
        <p>Country: Pakistan 🇵🇰</p>
        <div id="verify-text">Status: Checking...</div>
    </div>
    <button onclick="location.href='index.html'">Back to Game</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = { /* Aapki Config */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('u-email').innerText = user.email;
                onValue(ref(db, `users/${user.uid}`), (snap) => {
                    const data = snap.val();
                    if(data?.kycVerified) {
                        document.getElementById('verify-text').innerHTML = '<span class="status-v">✅ Verified Account 🇵🇰</span>';
                    } else {
                        document.getElementById('verify-text').innerText = 'Status: Not Verified';
                    }
                });
            }
        });
    </script>
</body>
</html>
