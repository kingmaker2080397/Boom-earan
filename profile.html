<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Boom</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #111; border: 2px solid #ffcc00; border-radius: 20px; padding: 30px; max-width: 400px; margin: auto; }
        .user-pic { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ffcc00; object-fit: cover; }
        .badge { font-weight: bold; font-size: 18px; margin: 15px 0; color: #ff4444; }
        .stats { background: #222; padding: 15px; border-radius: 10px; text-align: left; margin: 20px 0; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; background: #ffcc00; color: #000; }
    </style>
</head>
<body>

    <div class="card">
        <img id="u-pic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="user-pic">
        <div id="u-badge" class="badge">Status: Not Verified</div>

        <div class="stats">
            <p>💰 Balance: <b id="u-balance" style="color:#ffcc00">PKR 0</b></p>
            <p>📧 Email: <span id="u-email">...</span></p>
        </div>

        <button onclick="location.href='index.html'">BACK TO GAME</button>
        <button onclick="auth.signOut().then(()=>location.href='login.html')" style="background:#ff4444; color:#fff;">LOGOUT</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('u-email').innerText = user.email;
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    const data = snap.val();
                    if (data) {
                        document.getElementById('u-balance').innerText = "PKR " + (data.balance || 0);
                        document.getElementById('u-pic').src = data.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                        if (data.kycStatus === "verified") {
                            document.getElementById('u-badge').innerHTML = "Verified Member ✅";
                            document.getElementById('u-badge').style.color = "#00ff00";
                        }
                    }
                });
            } else { window.location.href = 'login.html'; }
        });
    </script>
</body>
</html>
