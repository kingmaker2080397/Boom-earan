<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        .p-box { background: #111; margin: 20px; padding: 30px; border: 1px solid #ffcc00; border-radius: 15px; }
        .dp { width: 100px; height: 100px; border-radius: 50%; border: 2px solid gold; object-fit: cover; }
        .v-badge { color: #00ff00; font-weight: bold; margin: 10px 0; display: block; }
        button { background: #ffcc00; padding: 12px; border: none; width: 80%; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        .logout { background: #ff3131; color: #fff; }
    </style>
</head>
<body>
    <h2>User Profile 🇵🇰</h2>
    <div class="p-box">
        <img id="user-dp" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="dp">
        <h3 id="p-name">Loading...</h3>
        <p id="p-email"></p>
        <span id="v-status" class="v-badge">Checking Status...</span>
        <button onclick="location.href='index.html'">Back to Game</button>
        <button class="logout" id="logout-btn">LOGOUT</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = { /* Config */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if(user) {
                onValue(ref(db, `users/${user.uid}`), (snap) => {
                    const d = snap.val();
                    document.getElementById('p-name').innerText = d?.name || "Player";
                    document.getElementById('p-email').innerText = user.email;
                    if(d?.kycVerified) document.getElementById('v-status').innerHTML = "✅ Verified Account 🇵🇰";
                    else document.getElementById('v-status').innerText = "❌ Not Verified";
                });
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.href='login.html');
    </script>
</body>
</html>
