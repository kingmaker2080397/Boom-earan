<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 90%; max-width: 400px; padding: 30px; border-radius: 25px; background: #1a1a1a; border: 1px solid #333; text-align: center; }
        .p-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #ffcc00; margin-bottom: 15px; object-fit: cover; }
        .status-badge { font-size: 0.8rem; padding: 5px 12px; border-radius: 20px; display: inline-block; margin-bottom: 20px; }
        .balance-card { background: #222; padding: 20px; border-radius: 15px; margin: 20px 0; border-left: 5px solid #ffcc00; }
        .btn { display: block; width: 100%; padding: 14px; margin: 12px 0; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-gold { background: #ffcc00; color: #000; }
        .btn-dark { background: #333; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <img id="u-pic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="p-img">
        <h2 id="u-name">Player</h2>
        <div id="u-badge" class="status-badge" style="color:#ff4444; background: rgba(255,0,0,0.1);">KYC Pending</div>
        
        <div class="balance-card">
            <span style="color: #aaa;">Total Balance</span>
            <div id="u-balance" style="color:#ffcc00; font-size: 1.8rem; font-weight: bold;">PKR 0</div>
        </div>

        <a href="kyc.html" class="btn btn-gold">🛡️ VERIFY KYC</a>
        <a href="wallet.html" class="btn btn-gold">💳 WITHDRAW FUNDS</a>
        <a href="index.html" class="btn btn-dark">🔙 BACK TO GAME</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALm0SnUYjeeh4kJj9QBk4BgaINwnooa3c",
            authDomain: "boom-earnings.firebaseapp.com",
            databaseURL: "https://boom-earnings-default-rtdb.firebaseio.com",
            projectId: "boom-earnings",
            appId: "1:787871998344:web:3c20aa47e7e51001d01a3d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    const data = snap.val();
                    if (data) {
                        document.getElementById('u-name').innerText = data.name || "Player";
                        document.getElementById('u-balance').innerText = "PKR " + (data.balance || 0);
                        document.getElementById('u-pic').src = data.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                        if (data.kycStatus === "verified") {
                            const badge = document.getElementById('u-badge');
                            badge.innerText = "Verified Member ✅";
                            badge.style.color = "#00ff00";
                            badge.style.background = "rgba(0,255,0,0.1)";
                        }
                    }
                });
            } else { location.href = 'login.html'; }
        });
    </script>
</body>
</html>
